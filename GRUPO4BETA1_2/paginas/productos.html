<section class="py-16">
  <div class="max-w-7xl mx-auto px-6">

    <div class="mb-10">
      <h1 class="font-serif text-3xl md:text-4xl text-navy"> Nuestros productos</h1>
      <p class="mt-2 text-carbon/70">
        Encuentra los productos que tenemos disponibles en nuestra tienda.
      </p>
    </div>

    <div id="contenedorProductos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

    <p id="mensajeCarga" class="text-center text-carbon/70 py-10">
      Cargando productos...
    </p>

  </div>
</section>

<!-- Modal de detalle de producto con animación Fade In, con duración de 300ms. -->
<div 
  id="modalOverlay" 
  class="fixed inset-0 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center justify-center p-4 z-50"
>
  <div 
    id="modalCaja" 
    class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl transform scale-95 transition-all duration-200 ease-out p-6"
  >
    <button 
      id="btnCerrarModal" 
      type="button"
      class="absolute top-4 right-4 z-10 w-7 h-7 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-carbon/60 hover:text-carbon text-xl transition-colors"
    >
      &times;
    </button>
    <div id="modalContenido" class="p-2 text-center text-carbon/70">
      Cargando...
    </div>
  </div>
</div>

<script>
  (function () {
    const contenedor = document.getElementById("contenedorProductos");
    const mensajeCarga = document.getElementById("mensajeCarga");

    fetch("https://fakestoreapi.com/products")
      .then(function (respuesta) {
        if (!respuesta.ok) throw new Error("No se pudieron obtener los productos");
        return respuesta.json();
      })
      .then(function (productos) {
        mensajeCarga.style.display = "none";

        productos.forEach(function (producto) {
          const card = document.createElement("article");

          // Cards diseñadas exclusivamente con Tailwind.
          card.className =
            "bg-white rounded-xl border border-black/5 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between";

          card.innerHTML = `
            <div class="p-4 flex flex-col h-full justify-between">
              <div>
                <div class="h-56 flex items-center justify-center bg-gray-50 rounded-lg p-4 group overflow-hidden">
                  <img
                    src="${producto.image}"
                    alt="${producto.title}"
                    class="max-h-48 max-w-full object-contain transition-transform duration-300 group-hover:scale-105"
                  >
                </div>

                <div class="pt-5">
                  <h2 class="font-serif text-lg text-navy font-semibold line-clamp-2 min-h-[56px]">
                    ${producto.title}
                  </h2>

                  <p class="mt-3 text-xl font-semibold text-navy">
                    S/ ${producto.price.toFixed(2)}
                  </p>
                  <p class="mt-2 text-sm text-carbon/70 line-clamp-2">
                     ${producto.description}
                  </p>
                </div>
              </div>

              <button
                type="button"
                class="btnVerMas mt-5 w-full boton-dorado px-4 py-3 rounded-md font-medium transition-transform active:scale-95 shadow-sm"
                data-id="${producto.id}"
              >
                Ver más
              </button>
            </div>
          `;

          contenedor.appendChild(card);
        });
      })
      .catch(function (error) {
        mensajeCarga.textContent = "No se pudieron cargar los productos. Intenta nuevamente.";
        console.error("Error:", error);
      });
  })();

  (function () {
    const overlay = document.getElementById("modalOverlay");
    const modalCaja = document.getElementById("modalCaja");
    const modalContenido = document.getElementById("modalContenido");
    const btnCerrarModal = document.getElementById("btnCerrarModal");
    const contenedor = document.getElementById("contenedorProductos");

    contenedor.addEventListener("click", function (e) {
      const boton = e.target.closest(".btnVerMas");
      if (!boton) return;

      const id = boton.dataset.id;
      abrirModal(id);
    });

    function abrirModal(id) {
      overlay.classList.remove("opacity-0", "pointer-events-none");
      overlay.classList.add("opacity-100", "pointer-events-auto");
      modalCaja.classList.remove("scale-95");
      modalCaja.classList.add("scale-100");

      modalContenido.innerHTML = `<p class="py-10">Cargando producto...</p>`;

      fetch(`https://fakestoreapi.com/products/${id}`)
        .then(function (respuesta) {
          if (!respuesta.ok) throw new Error("No se pudo obtener el producto");
          return respuesta.json();
        })
        .then(function (producto) {
          // Rediseñado en 2 columnas para el Modal con Tailwind
          modalContenido.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left items-center pt-2">
              <div class="h-64 md:h-72 flex items-center justify-center bg-gray-50 rounded-xl p-4 border border-gray-100">
                <img src="${producto.image}" alt="${producto.title}" class="max-h-56 max-w-full object-contain">
              </div>

              <div class="flex flex-col justify-between h-full space-y-3">
                <div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="inline-block text-[11px] uppercase tracking-wider text-slate-600 bg-slate-100 border border-slate-200/60 rounded-md px-2.5 py-1 font-semibold">
                      ${producto.category}
                    </span>
                    
                    ${
                      producto.rating
                        ? `<span class="inline-flex items-center gap-1 text-xs font-semibold text-amber-700 bg-amber-50 px-2 py-1 rounded-md">
                             ${producto.rating.rate} <span class="text-gray-400 font-normal">(${producto.rating.count})</span>
                           </span>`
                        : ""
                    }
                  </div>

                  <h2 class="mt-3 font-serif text-xl md:text-2xl text-navy font-bold leading-snug">
                    ${producto.title}
                  </h2>

                  <p class="mt-2 text-2xl font-extrabold text-navy">
                    S/ ${producto.price.toFixed(2)}
                  </p>

                  <p class="mt-3 text-sm text-carbon/70 leading-relaxed line-clamp-4">
                    ${producto.description}
                  </p>
                </div>

                <div class="pt-4 border-t border-gray-100">
                  <button onclick="carroNotificacion()" type="button" class="w-full boton-dorado py-3 px-6 rounded-lg font-semibold shadow-md transition-transform active:scale-95">
                    Añadir al carrito
                  </button>
                </div>
              </div>
            </div>
          `;
        })
        .catch(function (error) {
          modalContenido.innerHTML = `<p class="py-10 text-carbon/70">No se pudo cargar el producto. Intenta nuevamente.</p>`;
          console.error("Error:", error);
        });
    }

    function cerrarModal() {
      overlay.classList.remove("opacity-100", "pointer-events-auto");
      overlay.classList.add("opacity-0", "pointer-events-none");
      modalCaja.classList.remove("scale-100");
      modalCaja.classList.add("scale-95");
    }

    btnCerrarModal.addEventListener("click", cerrarModal);

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) cerrarModal();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") cerrarModal();
    });
  })();
  function carroNotificacion(){
      alert("Producto agregado al carrito");
      return;
    }
</script>
